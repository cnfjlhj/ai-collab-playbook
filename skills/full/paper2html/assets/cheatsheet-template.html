<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__TITLE__</title>
    <meta name="research-description" content="__DESCRIPTION__" />
    <meta name="research-date" content="__DATE__" />
    <meta name="research-tags" content="__TAGS__" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
      :root {
        --bg: #f5f5f7;
        --paper: #fff;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --line: #e5e5ea;
        --blue: #0066cc;
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.06);
      }
      * { box-sizing: border-box; }
      html, body { overflow-x: hidden; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.72;
        -webkit-font-smoothing: antialiased;
      }
      .nav {
        position: fixed;
        inset: 0 0 auto;
        z-index: 20;
        backdrop-filter: blur(22px);
        background: rgba(245, 245, 247, 0.78);
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .nav-inner {
        max-width: 1180px;
        margin: 0 auto;
        padding: 13px 24px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
      }
      .brand { font-weight: 700; white-space: nowrap; }
      .links { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 13px; font-weight: 600; }
      .links a { color: inherit; text-decoration: none; }
      .hero { max-width: 980px; margin: 0 auto; padding: 128px 24px 48px; text-align: center; }
      .badge-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
      .badge { border-radius: 999px; padding: 7px 12px; background: #e8f2ff; color: #064f9e; font-size: 12px; font-weight: 700; }
      .badge.gray { background: #eeeeef; color: #4d4d52; }
      h1 { margin: 0; font-size: clamp(36px, 6.2vw, 72px); line-height: 1.03; letter-spacing: -0.055em; overflow-wrap: anywhere; }
      .subtitle { max-width: 780px; margin: 22px auto 0; color: var(--muted); font-size: clamp(17px, 2.1vw, 22px); }
      .container { max-width: 1080px; margin: 0 auto; padding: 0 24px 56px; }
      .grid-3, .two-col, .ref-list { display: grid; gap: 16px; min-width: 0; }
      .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .two-col, .ref-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric, section.card {
        background: var(--paper);
        box-shadow: var(--shadow);
        border: 1px solid rgba(0, 0, 0, 0.045);
        min-width: 0;
      }
      .metric { border-radius: 22px; padding: 20px; }
      .metric .num { display: block; font-size: 32px; line-height: 1; font-weight: 800; }
      .metric .label { display: block; margin-top: 9px; color: var(--muted); font-size: 14px; }
      section.card { border-radius: 28px; padding: clamp(26px, 4vw, 48px); margin: 22px 0; }
      h2 { margin: 0 0 18px; font-size: clamp(28px, 4vw, 44px); line-height: 1.08; letter-spacing: -0.045em; }
      h3 { margin: 28px 0 10px; font-size: 21px; line-height: 1.24; }
      p { margin: 0 0 14px; }
      p, li, td, th, .metric .label, .subtitle { overflow-wrap: anywhere; word-break: break-word; }
      .lead { color: #36363a; font-size: 18px; }
      .muted { color: var(--muted); }
      .callout, .mini-card, .ref { border: 1px solid var(--line); background: #f8f8fa; border-radius: 18px; padding: 18px; }
      .formula, .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; }
      .formula { padding: 12px 14px; background: #fafafa; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
      th { background: #f5f5f7; font-weight: 800; }
      figure { margin: 24px 0 8px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
      figure img { display: block; width: 100%; height: auto; }
      figcaption { padding: 12px 16px; color: var(--muted); font-size: 13px; background: #fbfbfd; border-top: 1px solid var(--line); }
      footer { max-width: 1080px; margin: 0 auto; padding: 0 24px 56px; color: var(--muted); font-size: 13px; }
      @media (max-width: 820px) {
        .links { display: none; }
        .hero { padding: 102px 18px 48px; }
        .container { width: 100vw; max-width: 100vw; padding-left: 16px; padding-right: 16px; }
        h1 { max-width: calc(100vw - 36px); margin: 0 auto; font-size: 34px; line-height: 1.12; letter-spacing: -0.04em; }
        .grid-3, .two-col, .ref-list { grid-template-columns: 1fr; }
        section.card { border-radius: 22px; padding: 24px 18px; }
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <div class="nav-inner">
        <div class="brand">__SHORT_TITLE__</div>
        <div class="links">
          <a href="#motivation">研究动机</a>
          <a href="#method">方法</a>
          <a href="#experiments">实验</a>
          <a href="#results">结果</a>
          <a href="#review">评论</a>
          <a href="#references">Reference</a>
        </div>
      </div>
    </nav>
    <header class="hero">
      <div class="badge-row">
        <span class="badge">__BADGE_1__</span>
        <span class="badge gray">__BADGE_2__</span>
      </div>
      <h1>__TITLE__</h1>
      <p class="subtitle">__SUBTITLE__</p>
    </header>
    <main class="container">
      __CONTENT__
      <section class="card" id="references">
        <h2>Reference / Evidence</h2>
        __PUBLIC_REFERENCES__
      </section>
    </main>
    <footer>Generated with paper2html. Public pages list public online sources only.</footer>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.renderMathInElement) {
          renderMathInElement(document.body, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "\\[", right: "\\]", display: true },
              { left: "\\(", right: "\\)", display: false },
              { left: "$", right: "$", display: false }
            ],
            throwOnError: false
          });
        }
      });
    </script>
  </body>
</html>
